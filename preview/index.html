<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#111111">
	<title>Nook Interactive Demo</title>
	<link rel="stylesheet" href="./style.css">
</head>
<body>
	<header class="previewHeader">
		<div><strong>Nook Interactive Demo</strong><span>GitHub Pages</span></div>
		<div class="previewControls" role="group" aria-label="Preview size">
			<button class="previewMode active" data-mode="desktop">Desktop</button>
			<button class="previewMode" data-mode="mobile">Mobile</button>
		</div>
	</header>

	<main class="stage">
		<div id="device" class="device desktop">
			<div class="appShell">
				<aside class="sidebar">
					<button class="brand buttonReset" data-route="home">Nook</button>
					<nav class="primary">
						<button class="navItem active" data-route="home"><span class="icon">⌂</span><span>Home</span></button>
						<button class="navItem" data-route="explore"><span class="icon">⌖</span><span>Explore</span></button>
						<button class="navItem" data-route="community"><span class="icon">◉</span><span>Community</span></button>
						<button class="navItem" data-route="chat"><span class="icon">◌</span><span>Chat</span><i class="dot"></i></button>
						<button class="create" id="openComposer">＋ <span>Create</span></button>
					</nav>
					<nav class="secondary">
						<button class="navItem" data-route="notifications"><span class="icon">♢</span><span>Notifications</span><i class="dot"></i></button>
						<button class="navItem" data-route="settings"><span class="icon">⚙</span><span>Settings</span></button>
						<button class="account" data-route="profile"><span class="avatar">N</span><span class="accountText"><b>Nagisa</b><small>@nagisa</small></span><span>•••</span></button>
					</nav>
				</aside>

				<section class="content">
					<div id="mobileTop" class="mobileTop"><button class="brand buttonReset" data-route="home">Nook</button><button class="iconButton" data-route="notifications">♢</button></div>
					<div id="page"></div>
					<nav class="mobileNav">
						<button data-route="home">⌂<span>Home</span></button>
						<button data-route="explore">⌖<span>Explore</span></button>
						<button id="mobileCreate">＋<span>Create</span></button>
						<button data-route="community">◉<span>Community</span></button>
						<button data-route="chat">◌<span>Chat</span></button>
					</nav>
				</section>

				<aside class="rightRail" id="rightRail">
					<div class="panel"><b>What's happening</b><p>#Nook</p><p>#Creative</p><p>#Community</p></div>
					<div class="panel"><b>Suggested</b><p>@motion</p><p>@design</p></div>
				</aside>
			</div>
		</div>
	</main>

	<div class="modalBackdrop" id="composerBackdrop" hidden>
		<section class="composer" role="dialog" aria-modal="true" aria-label="Create post">
			<div class="composerHead"><b>Create post</b><button id="closeComposer">×</button></div>
			<textarea id="composerText" maxlength="280" placeholder="いまどうしてる？"></textarea>
			<div class="composerFoot"><span id="charCount">0 / 280</span><button id="submitPost">Post</button></div>
		</section>
	</div>

	<p class="notice">操作できるUIデモです。内容はブラウザ内だけのダミーデータで、実際のNookサーバーには保存されません。</p>
	<script src="./app.js"></script>
</body>
</html>
