name: Regenerate recommendation API types

on:
  push:
    branches:
      - agent/stabilize-recommendation-pagination

permissions:
  contents: write

concurrency:
  group: regenerate-recommendation-autogen
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages
        run: |
          pnpm build-pre
          pnpm --filter i18n build
          pnpm --filter misskey-reversi build
          pnpm --filter misskey-js build
          pnpm --filter misskey-bubble-game build

      - name: Regenerate misskey-js API types
        run: pnpm build-misskey-js-with-types

      - name: Commit generated API types
        shell: bash
        run: |
          set -euo pipefail
          git add packages/misskey-js/src/autogen
          if git diff --cached --quiet; then
            echo "Generated API types are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update generated recommendation API types"
          git push origin HEAD:agent/stabilize-recommendation-pagination
