name: Import Misskey foundation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-misskey-foundation.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nook metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Misskey and overlay Nook foundation
        env:
          TARGET_BRANCH: agent/phase-1-policy-foundation
          EXPECTED_HEAD: 6a93f20c33a0a82cde61370e043562ba773c5b71
          UPSTREAM_COMMIT: 00f66349766dc61298c66129ded5fdeb29e93f41
        run: |
          git fetch origin "$TARGET_BRANCH"
          git clone --filter=blob:none https://github.com/misskey-dev/misskey.git imported
          git -C imported checkout "$UPSTREAM_COMMIT"
          git archive "origin/$TARGET_BRANCH" | tar -x -C imported
          git -C imported config user.name "github-actions[bot]"
          git -C imported config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C imported add --all
          git -C imported commit -m "Add Nook Phase 1 foundation"
          git -C imported remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C imported push origin "HEAD:refs/heads/$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD"
