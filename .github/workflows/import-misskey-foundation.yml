name: Import Misskey foundation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-misskey-foundation.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nook metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Misskey and overlay Nook foundation
        env:
          TARGET_BRANCH: agent/phase-1-policy-foundation
          EXPECTED_HEAD: 6a93f20c33a0a82cde61370e043562ba773c5b71
          UPSTREAM_COMMIT: 00f66349766dc61298c66129ded5fdeb29e93f41
        run: |
          git fetch origin "$TARGET_BRANCH"
          mkdir imported
          git -C imported init
          git -C imported remote add upstream https://github.com/misskey-dev/misskey.git
          git -C imported fetch --depth 1 upstream "$UPSTREAM_COMMIT"
          git -C imported checkout --detach FETCH_HEAD
          git -C imported checkout --orphan nook-import
          git archive "origin/$TARGET_BRANCH" | tar -x -C imported
          git -C imported rm -r --ignore-unmatch .github/workflows
          git -C imported config user.name "github-actions[bot]"
          git -C imported config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C imported add --all
          git -C imported commit -m "Import Misskey and add Nook Phase 1 foundation"
          AUTH_HEADER="$(git config --local --get http.https://github.com/.extraheader)"
          git -C imported remote add target "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C imported -c http.https://github.com/.extraheader="$AUTH_HEADER" push --no-thin target "HEAD:refs/heads/$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD"
