name: Import Misskey foundation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-misskey-foundation.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nook metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR-ready integration branch
        env:
          SOURCE_BRANCH: agent/phase-1-policy-foundation
          INTEGRATION_BRANCH: agent/phase-1-integration
          UPSTREAM_COMMIT: 00f66349766dc61298c66129ded5fdeb29e93f41
        run: |
          git fetch origin "$SOURCE_BRANCH"
          git switch -c "$INTEGRATION_BRANCH"
          IMPORT_DIR="$(mktemp -d)"
          git -C "$IMPORT_DIR" init
          git -C "$IMPORT_DIR" remote add upstream https://github.com/misskey-dev/misskey.git
          git -C "$IMPORT_DIR" fetch --depth 1 upstream "$UPSTREAM_COMMIT"
          git -C "$IMPORT_DIR" checkout --detach FETCH_HEAD
          git -C "$IMPORT_DIR" checkout --orphan nook-import
          git -C "$IMPORT_DIR" rm -r -f --ignore-unmatch .github/workflows
          git archive "origin/$SOURCE_BRANCH" | tar -x -C "$IMPORT_DIR"
          tar --exclude=.git -C "$IMPORT_DIR" -cf - . | tar -xf -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Import Misskey and add Nook Phase 1 foundation"
          git push origin "$INTEGRATION_BRANCH"
