name: Community 2 verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agent/close-community-join-bypass

permissions:
  contents: write

concurrency:
  group: community-2-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54312:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test-misskey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56312:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test configuration
        run: |
          mkdir -p .config
          cp .github/misskey/test.yml .config/test.yml
          cp .github/misskey/test.yml .config/default.yml

      - name: Build shared workspace packages
        run: |
          pnpm build-pre
          pnpm --filter i18n build
          pnpm --filter misskey-reversi build
          pnpm --filter misskey-js build
          pnpm --filter misskey-bubble-game build

      - name: Backend typecheck
        id: backend_typecheck
        continue-on-error: true
        run: pnpm --filter backend typecheck

      - name: Backend ESLint
        id: backend_eslint
        continue-on-error: true
        run: pnpm --filter backend eslint

      - name: Backend Nook and Community unit tests
        id: backend_tests
        continue-on-error: true
        run: >-
          pnpm --filter backend exec vitest run --config vitest.config.unit.ts
          test/unit/NookAccessService.ts
          test/unit/NookChatRoomJoinEndpoint.ts
          test/unit/NookLikesPrivacy.ts
          test/unit/NookPolicyEngine.ts
          test/unit/nook
          test/unit/nook-community-access.ts
          test/unit/nook-community-age.ts
          test/unit/nook-community-api-gate.ts
          test/unit/nook-community-authorization.ts
          test/unit/nook-community-bot-runtime-access.ts
          test/unit/nook-community-communication.ts
          test/unit/nook-community-endpoint-privacy.ts
          test/unit/nook-community-events.ts
          test/unit/nook-community-members.ts
          test/unit/nook-community-membership.ts
          test/unit/nook-community-references.ts
          test/unit/nook-community-restricted-mutations.ts
          test/unit/nook-community-roles.ts
          test/unit/nook-community-voice-session.ts
          test/unit/nook-translation-cache.ts

      - name: Frontend typecheck
        id: frontend_typecheck
        continue-on-error: true
        run: pnpm --filter frontend typecheck

      - name: Frontend ESLint
        id: frontend_eslint
        continue-on-error: true
        run: pnpm --filter frontend eslint

      - name: Frontend Nook unit tests
        id: frontend_tests
        continue-on-error: true
        run: >-
          pnpm --filter frontend exec vitest run --globals --config vitest.config.unit.ts
          test/unit/nook-community-voice.test.ts
          test/unit/nook-timeline.test.ts
          test/unit/nook-video-feed.test.ts

      - name: misskey-js typecheck
        id: misskey_js_typecheck
        continue-on-error: true
        run: pnpm --filter misskey-js typecheck

      - name: misskey-js ESLint
        id: misskey_js_eslint
        continue-on-error: true
        run: pnpm --filter misskey-js eslint

      - name: Verify migrations up, down, and schema cleanliness
        id: migrations
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter backend build
          pnpm --filter backend migrate
          pnpm --filter backend check-migrations

          NOOK_MIGRATION_COUNT="$(git diff --diff-filter=A --name-only origin/main...HEAD -- 'packages/backend/migration/*.js' | wc -l | tr -d ' ')"
          echo "Community branch added ${NOOK_MIGRATION_COUNT} migration(s)."
          for ((i = 0; i < NOOK_MIGRATION_COUNT; i++)); do
            pnpm --filter backend revert
          done

          pnpm --filter backend migrate
          pnpm --filter backend check-migrations

      - name: Regenerate misskey-js API types
        id: autogen
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm build-misskey-js-with-types

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "agent/close-community-join-bypass" ]; then
            python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          entry = '- Feat: Communityの年齢モードと成人・未成年の安全境界を追加\n'
          marker = '### Client\n'
          if entry not in text:
              if marker not in text:
                  raise SystemExit('CHANGELOG Client section not found')
              text = text.replace(marker, marker + entry, 1)
              path.write_text(text, encoding='utf-8')
          PY

            changed="$(git diff --name-only)"
            unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(CHANGELOG\.md|packages/misskey-js/src/autogen/types\.ts)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::Unexpected generated changes:"
              printf '%s\n' "$unexpected"
              exit 1
            fi

            if [ -n "$changed" ]; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add CHANGELOG.md packages/misskey-js/src/autogen/types.ts
              git commit -m 'chore: regenerate Community API types'
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi

          if ! git diff --exit-code -- packages/misskey-js/src/autogen; then
            echo "::error::misskey-js generated API types are out of date. Commit the regenerated files."
            exit 1
          fi

      - name: Summarize verification result
        if: always()
        shell: bash
        env:
          BACKEND_TYPECHECK: ${{ steps.backend_typecheck.outcome }}
          BACKEND_ESLINT: ${{ steps.backend_eslint.outcome }}
          BACKEND_TESTS: ${{ steps.backend_tests.outcome }}
          FRONTEND_TYPECHECK: ${{ steps.frontend_typecheck.outcome }}
          FRONTEND_ESLINT: ${{ steps.frontend_eslint.outcome }}
          FRONTEND_TESTS: ${{ steps.frontend_tests.outcome }}
          MISSKEY_JS_TYPECHECK: ${{ steps.misskey_js_typecheck.outcome }}
          MISSKEY_JS_ESLINT: ${{ steps.misskey_js_eslint.outcome }}
          MIGRATIONS: ${{ steps.migrations.outcome }}
          AUTOGEN: ${{ steps.autogen.outcome }}
        run: |
          set -u
          failed=0
          for check in \
            BACKEND_TYPECHECK BACKEND_ESLINT BACKEND_TESTS \
            FRONTEND_TYPECHECK FRONTEND_ESLINT FRONTEND_TESTS \
            MISSKEY_JS_TYPECHECK MISSKEY_JS_ESLINT MIGRATIONS AUTOGEN
          do
            result="${!check}"
            printf '%-24s %s\n' "$check" "$result"
            if [ "$result" != "success" ]; then
              failed=1
              echo "::error::${check} finished with ${result}"
            fi
          done
          exit "$failed"
