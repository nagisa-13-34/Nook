name: Apply note body editing integration v2

on:
  push:
    branches:
      - agent/note-body-edit

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[note-edit-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54312:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test-misskey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56312:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/note-body-edit
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Apply integration patch
        run: python scripts/apply-note-edit.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test configuration
        run: |
          mkdir -p .config
          cp .github/misskey/test.yml .config/test.yml
          cp .github/misskey/test.yml .config/default.yml

      - name: Build shared packages
        run: |
          pnpm build-pre
          pnpm --filter i18n build
          pnpm --filter misskey-reversi build
          pnpm --filter misskey-js build
          pnpm --filter misskey-bubble-game build

      - name: Regenerate API types
        run: |
          pnpm build-misskey-js-with-types
          git checkout -- packages/misskey-js/etc/misskey-js.api.md || true

      - name: Validate backend and frontend
        run: |
          pnpm --filter backend typecheck
          pnpm --filter backend eslint
          pnpm --filter backend exec vitest run --config vitest.config.unit.ts src/server/api/endpoints/notes/edit.test.ts
          pnpm --filter frontend typecheck
          pnpm --filter frontend eslint
          pnpm --filter misskey-js typecheck
          pnpm --filter misskey-js eslint

      - name: Verify migration
        run: |
          pnpm --filter backend build
          pnpm --filter backend migrate
          pnpm --filter backend check-migrations
          pnpm --filter backend revert
          pnpm --filter backend migrate
          pnpm --filter backend check-migrations

      - name: Commit generated integration
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/note-edit-apply-v2.yml scripts/apply-note-edit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/backend packages/frontend packages/misskey-js/src/autogen packages/misskey-js/src/streaming.types.ts
          git commit -m "feat: support editing note bodies [note-edit-applied]"
          git push origin HEAD:agent/note-body-edit
