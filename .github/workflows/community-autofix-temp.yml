name: Community lint autofix (temporary)

on:
  push:
    branches:
      - fix/community-ci-stabilization

permissions:
  contents: write

concurrency:
  group: community-lint-autofix-temp
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/community-ci-stabilization
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages
        run: |
          pnpm build-pre
          pnpm --filter i18n build
          pnpm --filter misskey-reversi build
          pnpm --filter misskey-js build
          pnpm --filter misskey-bubble-game build

      - name: Auto-fix backend Community lint
        run: >-
          pnpm --filter backend exec eslint --fix
          "src/nook/**/*.ts"
          "src/server/api/endpoints/nook/**/*.ts"
          src/server/api/endpoints/chat/rooms/join.ts
          || true

      - name: Auto-fix frontend Community lint
        run: >-
          pnpm --filter frontend exec eslint --fix
          "src/nook/community/**/*.{ts,vue}"
          src/pages/channel.vue
          || true

      - name: Commit autofixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No lint autofixes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/backend/src packages/frontend/src
          git commit -m "Auto-fix Community lint formatting"
          git push origin HEAD:fix/community-ci-stabilization
