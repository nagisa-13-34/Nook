# Temporary verification workflow for agent/global-events. It intentionally never runs migrations.
name: Global events finish (no migrations)

on:
  push:
    branches:
      - agent/global-events

permissions:
  contents: write

concurrency:
  group: global-events-finish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages
        run: |
          pnpm build-pre
          pnpm --filter i18n build
          pnpm --filter misskey-reversi build
          pnpm --filter misskey-js build
          pnpm --filter misskey-bubble-game build

      - name: Regenerate misskey-js API types
        run: pnpm build-misskey-js-with-types

      - name: Update Unreleased changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text()
          client_entry = '- Feat: Communityに属さないイベントも作成・閲覧できるイベントページを追加\n'
          server_entry = '- Feat: Nookイベントに公開範囲と参加範囲を追加し、Communityに属さないイベントAPIに対応\n'

          if client_entry not in text:
              text = text.replace('### Client\n', '### Client\n' + client_entry, 1)
          if server_entry not in text:
              text = text.replace('### Server\n', '### Server\n' + server_entry, 1)

          path.write_text(text)
          PY

      - name: Commit generated files and changelog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md packages/misskey-js/src/autogen
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate global event API types"
            git push origin HEAD:agent/global-events
          fi

      - name: Rebuild misskey-js after generation
        run: pnpm --filter misskey-js build

      - name: Backend typecheck
        id: backend_typecheck
        continue-on-error: true
        run: pnpm --filter backend typecheck

      - name: Backend ESLint
        id: backend_eslint
        continue-on-error: true
        run: pnpm --filter backend eslint

      - name: Nook event unit tests
        id: backend_tests
        continue-on-error: true
        run: pnpm --filter backend exec vitest run --config vitest.config.unit.ts test/unit/nook-community-events.ts

      - name: Frontend typecheck
        id: frontend_typecheck
        continue-on-error: true
        run: pnpm --filter frontend typecheck

      - name: Frontend ESLint
        id: frontend_eslint
        continue-on-error: true
        run: pnpm --filter frontend eslint

      - name: misskey-js typecheck
        id: misskey_js_typecheck
        continue-on-error: true
        run: pnpm --filter misskey-js typecheck

      - name: misskey-js ESLint
        id: misskey_js_eslint
        continue-on-error: true
        run: pnpm --filter misskey-js eslint

      - name: Summarize result
        if: always()
        shell: bash
        env:
          BACKEND_TYPECHECK: ${{ steps.backend_typecheck.outcome }}
          BACKEND_ESLINT: ${{ steps.backend_eslint.outcome }}
          BACKEND_TESTS: ${{ steps.backend_tests.outcome }}
          FRONTEND_TYPECHECK: ${{ steps.frontend_typecheck.outcome }}
          FRONTEND_ESLINT: ${{ steps.frontend_eslint.outcome }}
          MISSKEY_JS_TYPECHECK: ${{ steps.misskey_js_typecheck.outcome }}
          MISSKEY_JS_ESLINT: ${{ steps.misskey_js_eslint.outcome }}
        run: |
          set -euo pipefail
          printf '%-24s %s\n' \
            'backend typecheck' "$BACKEND_TYPECHECK" \
            'backend eslint' "$BACKEND_ESLINT" \
            'event unit tests' "$BACKEND_TESTS" \
            'frontend typecheck' "$FRONTEND_TYPECHECK" \
            'frontend eslint' "$FRONTEND_ESLINT" \
            'misskey-js typecheck' "$MISSKEY_JS_TYPECHECK" \
            'misskey-js eslint' "$MISSKEY_JS_ESLINT"
          for result in \
            "$BACKEND_TYPECHECK" \
            "$BACKEND_ESLINT" \
            "$BACKEND_TESTS" \
            "$FRONTEND_TYPECHECK" \
            "$FRONTEND_ESLINT" \
            "$MISSKEY_JS_TYPECHECK" \
            "$MISSKEY_JS_ESLINT"; do
            if [ "$result" != success ]; then
              exit 1
            fi
          done
